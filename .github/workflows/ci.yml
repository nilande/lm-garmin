name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  integration:
    # Builds the test fixtures with mkgmap and verifies the decoded .img (from milestone M1).
    # Never uploads map data: only test reports and timings.
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      LM_GARMIN_CACHE: ${{ github.workspace }}/.cache/lm-garmin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: .cache/lm-garmin/tools
          key: tools-${{ hashFiles('src/lm_garmin/tools.py') }}
      - run: uv sync --locked
      - run: uv run lm-garmin tools fetch
      - name: Integration tests (with timings)
        run: uv run pytest -q -m integration --capture=tee-sys --durations=0 --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-report
          path: reports/
