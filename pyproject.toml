[project]
name = "lm-garmin"
version = "0.0.1"
description = "Build Garmin .img maps from Lantmäteriet's Topografi 50 (GeoPackage)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyogrio>=0.10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "osmium>=4.3.2",
    "pyarrow>=26.0.1",
    "rasterio>=1.4",
]

[project.scripts]
lm-garmin = "lm_garmin.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lm_garmin"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: builds .img files; needs Java and `lm-garmin tools fetch`",
    "local_data: needs the local Lantmäteriet delivery / GPX (never available in CI)",
]
addopts = "-m 'not integration and not local_data'"
